[package]
name = "sensenova-rs"
version = "0.1.0"
edition = "2021"
description = "Standalone Rust inference engine for SenseNova-Loop-9B (looped decoder + mHC + GatedDeltaNet), with AVX2/AVX-512-VNNI CPU kernels and an AMD OpenCL prefill backend"
license = "Apache-2.0"
repository = "https://github.com/kingfree/sensenova-loop-rs"
readme = "README.md"
keywords = ["llm", "inference", "gguf", "opencl", "rust"]
categories = ["science", "hardware-support"]
authors = ["Meimei <mei@nijino.tech>"]

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = "0.22"
rayon = "1"
serde_json = "1"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
